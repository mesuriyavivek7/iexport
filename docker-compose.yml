services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3008:3000"
    environment:
      - NODE_ENV=production
      # Set these on the VPS (e.g. in .env or docker-compose.override.yml)
      - BACKEND_URL=${BACKEND_URL:-http://backend:5020}
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3008}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-}
    restart: unless-stopped
